[project]
name = "mandategate"
version = "0.1.0"
description = "Deterministic security gateway between untrusted AI agents and real tools."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "openai>=3.33.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
